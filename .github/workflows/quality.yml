name: SiteThread quality gate

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/sitethread
      R2_BUCKET_NAME: sitethread-ci
      LIVEPEER_MCP_URL: https://agent.livepeer.org/api/mcp/raw
      MEDIA_PROVIDER_MODE: fixture
      PLAYWRIGHT_PORT: "3001"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.15.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Validate Prisma schema
        run: pnpm prisma:validate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:e2e
        env:
          CI: true
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
